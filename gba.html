<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emulador GBA</title>
    <style>
        :root {
            --body-bg: #151418;
            --case-bg: #330052;
            --case-bg-deep: #26003f;
            --case-line: rgba(164, 55, 224, 0.45);
            --control-bg: #585858;
            --control-bg-dark: #303030;
            --control-line: rgba(230, 230, 230, 0.18);
            --control-glow: rgba(0, 0, 0, 0.35);
            --label: rgba(255, 255, 255, 0.78);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: var(--body-bg);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100svh;
            display: grid;
            place-items: start center;
        }

        .emulator-shell {
            width: min(100vw, 440px, calc(100svh * 9 / 16));
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            padding: clamp(10px, 2.4vw, 14px) clamp(12px, 3vw, 18px) max(16px, env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 26% 30%, rgba(98, 0, 155, 0.9), transparent 34%),
                linear-gradient(180deg, var(--case-bg), var(--case-bg-deep));
            border: 2px solid var(--case-line);
            border-radius: 18px;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.03), 0 18px 45px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 3.4svh, 30px);
            overflow: hidden;
            position: relative;
        }

        .emulator-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 40;
            background: rgba(10, 0, 18, 0.58);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .emulator-shell.show-native-menu::before {
            opacity: 1;
            pointer-events: auto;
        }

        .emulator-shell.show-native-menu {
            overflow: visible;
            z-index: 2147483500;
        }

        .emulator-shell.show-native-menu::before {
            position: fixed;
            z-index: 2147483498;
        }

        .emulator-shell.show-native-menu .screen-frame,
        .emulator-shell.show-native-menu #game {
            overflow: visible;
        }

        .emulator-shell.show-native-menu .screen-frame {
            z-index: 2147483499;
        }

        .screen-frame {
            width: 100%;
            padding: clamp(14px, 3.5vw, 26px) clamp(14px, 3.5vw, 26px) clamp(22px, 4.7vw, 30px);
            background: #171719;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 4px 14px rgba(0, 0, 0, 0.44);
            position: relative;
        }

        .screen-brand {
            position: absolute;
            left: clamp(18px, 4vw, 28px);
            bottom: 5px;
            color: rgba(255, 255, 255, 0.38);
            font-size: clamp(13px, 3.2vw, 19px);
            font-weight: 700;
            line-height: 1;
        }

        #game {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        #game .ejs_parent,
        #game .ejs_game,
        #game .ejs_canvas_parent {
            width: 100% !important;
            height: 100% !important;
        }

        #game .ejs_canvas {
            object-fit: contain !important;
            object-position: center !important;
        }

        #game .ejs_virtualGamepad_parent,
        #game .ejs_virtualGamepad_open,
        #game .ejs_menu_bar {
            display: none !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_bar {
            display: flex !important;
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            right: auto !important;
            bottom: auto !important;
            width: min(348px, calc(100vw - 36px)) !important;
            max-height: min(560px, calc(100svh - 80px)) !important;
            padding: 14px !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 18px !important;
            background: rgba(14, 11, 18, 0.92) !important;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.06) !important;
            opacity: 1 !important;
            transform: translate(-50%, -50%) !important;
            pointer-events: auto !important;
            z-index: 2147483501 !important;
            overflow-y: auto !important;
            flex-direction: column !important;
            flex-wrap: nowrap !important;
            align-items: stretch !important;
            gap: 8px !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-back {
            order: -10 !important;
            width: 100% !important;
            min-height: 42px !important;
            margin: 0 0 6px !important;
            padding: 10px 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            border-radius: 12px !important;
            background: rgba(123, 31, 191, 0.42) !important;
            color: #fff !important;
            font: inherit !important;
            font-size: 14px !important;
            font-weight: 800 !important;
            cursor: pointer !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-instagram {
            order: 50 !important;
            width: 100% !important;
            min-height: 44px !important;
            margin: 6px 0 0 !important;
            padding: 10px 44px !important;
            border: 1px solid rgba(136, 255, 85, 0.34) !important;
            border-radius: 12px !important;
            background: linear-gradient(135deg, rgba(123, 31, 191, 0.94), rgba(43, 214, 111, 0.88)) !important;
            color: #fff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            position: relative !important;
            font: inherit !important;
            font-size: 14px !important;
            font-weight: 900 !important;
            text-decoration: none !important;
            box-shadow: 0 10px 22px rgba(49, 214, 110, 0.16) !important;
            cursor: pointer !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-instagram svg {
            width: 18px !important;
            height: 18px !important;
            flex: 0 0 auto !important;
            position: absolute !important;
            left: 14px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-instagram span {
            min-width: 0 !important;
            text-align: center !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_button {
            width: 100% !important;
            min-height: 42px !important;
            margin: 0 !important;
            padding: 9px 10px !important;
            border-radius: 10px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-volume {
            order: -9 !important;
            width: 100% !important;
            max-width: none !important;
            padding: 8px !important;
            margin: 0 0 6px !important;
            border-radius: 10px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            display: flex !important;
            flex: 0 0 auto !important;
            align-items: center !important;
            gap: 10px !important;
        }

        .emulator-shell.show-native-menu #game .custom-volume-icon {
            width: 44px !important;
            min-width: 44px !important;
            min-height: 40px !important;
            height: 40px !important;
            padding: 0 !important;
            justify-content: center !important;
            background: rgba(255, 255, 255, 0.06) !important;
            border: 0 !important;
            border-radius: 10px !important;
            color: #fff !important;
            display: flex !important;
            align-items: center !important;
        }

        .emulator-shell.show-native-menu #game .ejs_volume_parent {
            display: none !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-volume input[type=range] {
            width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
            position: relative !important;
            z-index: 3 !important;
            display: block !important;
            accent-color: #8f21d7 !important;
            touch-action: manipulation !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_text {
            color: #fff !important;
            display: block !important;
            flex: 0 1 auto !important;
            opacity: 1 !important;
            transform: none !important;
            position: static !important;
            white-space: normal !important;
            background: transparent !important;
            box-shadow: none !important;
            margin: 0 !important;
            padding: 0 !important;
            pointer-events: none !important;
            text-align: center !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_text::before,
        .emulator-shell.show-native-menu #game .ejs_menu_bar_spacer {
            display: none !important;
        }

        .controls {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: clamp(14px, 3.4svh, 26px);
            padding: 0 clamp(8px, 2vw, 12px);
        }

        .shoulder-row,
        .system-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .shoulder {
            width: clamp(115px, 28vw, 155px);
            height: clamp(48px, 7svh, 62px);
            border: 3px solid #2b2b2b;
            border-radius: 20px;
            background: linear-gradient(180deg, #6a6a6a 0%, #444 46%, #2d2d2d 100%);
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 800;
            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.22),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                inset 0 -12px 18px rgba(0, 0, 0, 0.45);
        }

        .ios-controller-logo {
            display: none;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        @media (orientation: portrait) {
            .ios-controller-logo {
                display: block;
                flex: 0 1 auto;
                width: clamp(102px, 27vw, 124px);
                height: clamp(40px, 7svh, 50px);
                object-fit: contain;
            }
        }

        .main-controls {
            display: grid;
            grid-template-columns: minmax(158px, 1fr) minmax(142px, 0.9fr);
            align-items: center;
            gap: clamp(18px, 4vw, 32px);
        }

        .dpad-wrap {
            width: clamp(156px, min(44vw, 25svh), 220px);
            aspect-ratio: 1;
            position: relative;
        }

        .dpad-wrap::before {
            display: none;
        }

        .dpad {
            width: 100%;
            height: 100%;
            position: relative;
            filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.34));
        }

        .dpad-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            transition: filter 120ms ease, transform 120ms ease;
            z-index: 1;
        }

        .dpad-hit {
            position: absolute;
            border: 0;
            background: transparent;
            z-index: 2;
        }

        .dpad-hit.up,
        .dpad-hit.down {
            width: 38%;
            height: 38%;
            left: 31%;
        }

        .dpad-hit.left,
        .dpad-hit.right {
            width: 38%;
            height: 38%;
            top: 31%;
        }

        .dpad-hit.up { top: 7%; }
        .dpad-hit.down { bottom: 7%; }
        .dpad-hit.left { left: 7%; }
        .dpad-hit.right { right: 7%; }

        .face-buttons {
            width: clamp(132px, min(36vw, 21svh), 178px);
            aspect-ratio: 1 / 0.92;
            justify-self: end;
            position: relative;
        }

        .face-action {
            position: absolute;
            width: clamp(50px, min(13.5vw, 8.5svh), 68px);
            aspect-ratio: 1;
            border: 4px solid #2a2a2a;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 42%, #666 0%, #444 54%, #2b2b2b 100%),
                var(--control-bg-dark);
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(15px, 4.2vw, 20px);
            font-weight: 800;
            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.25),
                inset 0 2px 0 rgba(255, 255, 255, 0.16),
                inset 0 -12px 18px rgba(0, 0, 0, 0.42);
        }

        .face-action::before {
            content: "";
            position: absolute;
            inset: 9px;
            border: 2px solid rgba(0, 0, 0, 0.16);
            border-radius: 50%;
        }

        .face-action span {
            position: absolute;
            left: 50%;
            bottom: -25px;
            transform: translateX(-50%);
        }

        .face-action.a { right: 4%; top: 18%; }
        .face-action.b { left: 4%; bottom: 18%; }

        .system-row {
            width: min(260px, 68vw);
            margin: 0 auto;
            padding-top: clamp(8px, 2svh, 18px);
        }

        .system-control {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            color: var(--label);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .pill-button {
            width: auto;
            min-width: 0;
            height: auto;
            min-height: 0;
            padding: 7px 10px;
            border-radius: 999px;
            border: 2px solid #151515;
            background: linear-gradient(180deg, #d5d5d5, #a9a9a9);
            color: #151515;
            font-size: 11px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.78),
                0 2px 0 rgba(0, 0, 0, 0.24);
        }

        .pill-button::before {
            content: attr(aria-label);
        }

        .menu-button {
            width: auto;
            min-width: 0;
            height: auto;
            min-height: 0;
            padding: 7px 10px;
            border-radius: 999px;
            border: 2px solid #151515;
            background: linear-gradient(180deg, #d5d5d5, #a9a9a9);
            color: #151515;
            font-size: 0;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.78),
                0 2px 0 rgba(0, 0, 0, 0.24);
        }

        .menu-button::before {
            content: "Menu";
            font-size: 11px;
        }

        .system-control span {
            display: none;
        }

        .touch-button {
            cursor: pointer;
            touch-action: none;
            outline: none;
        }

        .touch-button.is-pressed {
            filter: brightness(1.25);
            transform: scale(0.96);
        }

        .face-action.a.is-pressed,
        .face-action.b.is-pressed,
        .dpad-hit.is-pressed {
            transform: scale(0.96);
        }

        .dpad-wrap.pressed-up .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateY(-5px) scale(0.985);
        }

        .dpad-wrap.pressed-down .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateY(5px) scale(0.985);
        }

        .dpad-wrap.pressed-left .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateX(-5px) scale(0.985);
        }

        .dpad-wrap.pressed-right .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateX(5px) scale(0.985);
        }

        @media (max-height: 720px) {
            .emulator-shell {
                gap: 14px;
            }

            .controls {
                gap: 14px;
            }

            .screen-frame {
                padding-bottom: 20px;
            }

            .system-row {
                padding-top: 2px;
            }
        }

        @media (max-width: 360px) {
            .main-controls {
                grid-template-columns: 1fr 0.86fr;
                gap: 12px;
            }

            .controls {
                padding-inline: 0;
            }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            body {
                display: block;
            }

            .emulator-shell {
                width: 100vw;
                height: 100svh;
                max-width: none;
                aspect-ratio: auto;
                margin: 0;
                padding:
                    max(14px, env(safe-area-inset-top))
                    max(10px, env(safe-area-inset-right))
                    max(14px, env(safe-area-inset-bottom))
                    max(10px, env(safe-area-inset-left));
                border: 0;
                border-radius: 0;
                display: grid;
                place-items: center;
                gap: 0;
                overflow: hidden;
            }

            .screen-frame {
                width: min(60vw, calc((100svh - 28px) * 4 / 3));
                max-width: calc(100vw - clamp(390px, 58vw, 460px));
                min-width: min(276px, calc(100vw - 360px));
                padding: clamp(6px, 1.8svh, 10px) clamp(6px, 1.8svh, 10px) clamp(12px, 2.8svh, 16px);
                border-radius: 10px;
                z-index: 1;
            }

            .screen-brand {
                left: clamp(12px, 2vw, 18px);
                bottom: 3px;
                font-size: clamp(10px, 3svh, 14px);
            }

            .controls {
                position: absolute;
                inset: 0;
                margin: 0;
                padding: 0;
                border: 0;
                background: transparent;
                display: block;
                pointer-events: none;
            }

            .shoulder-row {
                position: absolute;
                left: max(10px, env(safe-area-inset-left));
                right: max(10px, env(safe-area-inset-right));
                top: max(6px, env(safe-area-inset-top));
                height: clamp(36px, 10svh, 46px);
                z-index: 3;
            }

            .shoulder {
                width: clamp(118px, 19vw, 162px);
                height: clamp(36px, 10svh, 46px);
                border-width: 2px;
                border-radius: 14px;
                font-size: clamp(18px, 4.8svh, 24px);
                pointer-events: auto;
            }

            .main-controls {
                position: absolute;
                inset: 0;
                display: grid;
                grid-template-columns: clamp(174px, 27vw, 212px) minmax(276px, 1fr) clamp(198px, 29vw, 224px);
                align-items: center;
                justify-content: stretch;
                gap: 0;
                padding:
                    max(46px, calc(env(safe-area-inset-top) + 40px))
                    max(10px, env(safe-area-inset-right))
                    max(78px, calc(env(safe-area-inset-bottom) + 70px))
                    max(10px, env(safe-area-inset-left));
                z-index: 2;
            }

            .dpad-wrap {
                grid-column: 1;
                width: clamp(158px, min(26vw, 46svh), 194px);
                justify-self: end;
                margin-right: clamp(16px, 2vw, 20px);
                pointer-events: auto;
            }

            .face-buttons {
                grid-column: 3;
                width: clamp(140px, min(20.8vw, 38svh), 164px);
                aspect-ratio: 1;
                justify-self: end;
                pointer-events: auto;
                transform: translateY(24px);
            }

            .face-action {
                width: clamp(52px, min(9.2vw, 15svh), 62px);
                border-width: 3px;
                font-size: clamp(16px, 4.8svh, 22px);
                pointer-events: auto;
            }

            .face-action span {
                bottom: -24px;
                pointer-events: none;
            }

            .system-row {
                position: absolute;
                inset: 0;
                transform: none;
                width: auto;
                height: auto;
                margin: 0;
                padding: 0;
                z-index: 3;
                pointer-events: none;
            }

            .system-control {
                position: absolute;
                min-width: 0;
                gap: 0;
                font-size: 9px;
                pointer-events: auto;
            }

            .system-control:first-child {
                left: calc(env(safe-area-inset-left) + 10px + (clamp(174px, 27vw, 212px) / 2) - 58px);
                bottom: max(7px, env(safe-area-inset-bottom));
            }

            .system-control:last-child {
                left: calc(env(safe-area-inset-left) + 10px + (clamp(174px, 27vw, 212px) / 2) + 8px);
                bottom: max(7px, env(safe-area-inset-bottom));
            }

            .pill-button {
                width: auto;
                min-width: 0;
                height: auto;
                min-height: 0;
                padding: 4px 6px;
                border-width: 2px;
                border-radius: 999px;
                background: linear-gradient(180deg, #d5d5d5, #a9a9a9);
                color: #151515;
                font-size: 9px;
                font-weight: 900;
                line-height: 1;
                text-transform: uppercase;
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.78),
                    0 2px 0 rgba(0, 0, 0, 0.24);
            }

            .pill-button::before {
                content: attr(aria-label);
            }

            .menu-button {
                position: absolute;
                right: calc(env(safe-area-inset-right) + 10px + (clamp(126px, min(18.6vw, 34svh), 146px) / 2) - 21px);
                bottom: max(7px, env(safe-area-inset-bottom));
                width: auto;
                min-width: 0;
                height: auto;
                min-height: 0;
                padding: 4px 6px;
                border-width: 2px;
                border-radius: 999px;
                background: linear-gradient(180deg, #d5d5d5, #a9a9a9);
                color: #151515;
                font-size: 0;
                font-weight: 900;
                line-height: 1;
                text-transform: uppercase;
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.78),
                    0 2px 0 rgba(0, 0, 0, 0.24);
                pointer-events: auto;
            }

            .menu-button::before {
                content: "Menu";
                font-size: 9px;
            }

            .system-control span {
                display: none;
            }

            .dpad-hit {
                pointer-events: auto;
            }

            .ios-controller-logo {
                display: block;
                position: fixed;
                left: calc(env(safe-area-inset-left) + 10px + (clamp(174px, 27vw, 212px) / 2));
                bottom: max(38px, calc(env(safe-area-inset-bottom) + 32px));
                width: clamp(118px, 15.5vw, 148px);
                height: clamp(44px, 8svh, 58px);
                object-fit: contain;
                transform: translateX(-50%);
                z-index: 4;
            }
        }

        @supports (-webkit-touch-callout: none) {
            @media (orientation: portrait) {
                .ios-controller-logo {

                releaseChangedTouches(event);
            }, { passive: false });

            var menuButton = document.querySelector('[data-menu]');
            menuButton.addEventListener('pointerup', activateMenu);
            menuButton.addEventListener('touchend', activateMenu, { passive: false });
            menuButton.addEventListener('click', activateMenu);

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    closeMenu();
                }
            });

            window.addEventListener('pointerup', function(event) {
                if (!shouldHandlePointerEvent(event)) return;
                release(activePointers[event.pointerId], event);
            });

            window.addEventListener('blur', function() {
                document.querySelectorAll('[data-input].is-pressed').forEach(function(button) {
                    release(button);
                });
                activePointers = {};
                activeTouches = {};
            });

            document.addEventListener('contextmenu', function(event) {
                event.preventDefault();
            });
        })();
    </script>
</body>
</html>
