<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emulador SNES</title>
    <style>
        :root {
            --body-bg: #151418;
            --case-bg: #d9d9d9;
            --case-bg-deep: #d9d9d9;
            --case-line: rgba(255, 255, 255, 0.36);
            --control-bg: #585858;
            --control-bg-dark: #303030;
            --control-line: rgba(230, 230, 230, 0.18);
            --control-glow: rgba(0, 0, 0, 0.35);
            --label: rgba(255, 255, 255, 0.78);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        *::selection {
            background: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: var(--body-bg);
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
        }

        button,
        img,
        .controls,
        .touch-button,
        .dpad,
        .dpad-image {
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100svh;
            display: grid;
            place-items: start center;
        }

        .emulator-shell {
            width: min(100vw, 440px, calc(100svh * 9 / 16));
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            padding: clamp(10px, 2.4vw, 14px) clamp(12px, 3vw, 18px) max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(180deg, var(--case-bg), var(--case-bg-deep));
            border: 2px solid var(--case-line);
            border-radius: 18px;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.03), 0 18px 45px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 3.4svh, 30px);
            overflow: hidden;
            position: relative;
        }

        .emulator-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 40;
            background: rgba(10, 0, 18, 0.58);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .emulator-shell.show-native-menu::before {
            opacity: 1;
            pointer-events: auto;
        }

        .emulator-shell.show-native-menu {
            overflow: visible;
            z-index: 2147483500;
        }

        .emulator-shell.show-native-menu::before {
            position: fixed;
            z-index: 2147483498;
        }

        .emulator-shell.show-native-menu .screen-frame,
        .emulator-shell.show-native-menu #game {
            overflow: visible;
        }

        .emulator-shell.show-native-menu .screen-frame {
            z-index: 2147483499;
        }

        .screen-frame {
            width: 100%;
            padding: clamp(14px, 3.5vw, 26px) clamp(14px, 3.5vw, 26px) clamp(22px, 4.7vw, 30px);
            background: #171719;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 4px 14px rgba(0, 0, 0, 0.44);
            position: relative;
        }

        #game {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        #game .ejs_parent,
        #game .ejs_game,
        #game .ejs_canvas_parent {
            width: 100% !important;
            height: 100% !important;
        }

        #game .ejs_canvas {
            object-fit: contain !important;
            object-position: center !important;
        }

        #game .ejs_virtualGamepad_parent,
        #game .ejs_virtualGamepad_open,
        #game .ejs_menu_bar {
            display: none !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_bar {
            display: flex !important;
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            right: auto !important;
            bottom: auto !important;
            width: min(348px, calc(100vw - 36px)) !important;
            max-height: min(560px, calc(100svh - 80px)) !important;
            padding: 14px !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            border-radius: 18px !important;
            background: rgba(14, 11, 18, 0.92) !important;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.06) !important;
            opacity: 1 !important;
            transform: translate(-50%, -50%) !important;
            pointer-events: auto !important;
            z-index: 2147483501 !important;
            overflow-y: auto !important;
            flex-direction: column !important;
            flex-wrap: nowrap !important;
            align-items: stretch !important;
            gap: 8px !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-back {
            order: -10 !important;
            width: 100% !important;
            min-height: 42px !important;
            margin: 0 0 6px !important;
            padding: 10px 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            border-radius: 12px !important;
            background: rgba(123, 31, 191, 0.42) !important;
            color: #fff !important;
            font: inherit !important;
            font-size: 14px !important;
            font-weight: 800 !important;
            cursor: pointer !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-instagram {
            order: 50 !important;
            width: 100% !important;
            min-height: 44px !important;
            margin: 6px 0 0 !important;
            padding: 10px 44px !important;
            border: 1px solid rgba(136, 255, 85, 0.34) !important;
            border-radius: 12px !important;
            background: linear-gradient(135deg, rgba(123, 31, 191, 0.94), rgba(43, 214, 111, 0.88)) !important;
            color: #fff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            position: relative !important;
            font: inherit !important;
            font-size: 14px !important;
            font-weight: 900 !important;
            text-decoration: none !important;
            box-shadow: 0 10px 22px rgba(49, 214, 110, 0.16) !important;
            cursor: pointer !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-instagram svg {
            width: 18px !important;
            height: 18px !important;
            flex: 0 0 auto !important;
            position: absolute !important;
            left: 14px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-instagram span {
            min-width: 0 !important;
            text-align: center !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_button {
            width: 100% !important;
            min-height: 42px !important;
            margin: 0 !important;
            padding: 9px 10px !important;
            border-radius: 10px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-hidden {
            display: none !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-volume {
            order: -9 !important;
            width: 100% !important;
            max-width: none !important;
            padding: 8px !important;
            margin: 0 0 6px !important;
            border-radius: 10px !important;
            background: rgba(255, 255, 255, 0.05) !important;
            display: flex !important;
            flex: 0 0 auto !important;
            align-items: center !important;
            gap: 10px !important;
        }

        .emulator-shell.show-native-menu #game .custom-volume-icon {
            width: 44px !important;
            min-width: 44px !important;
            min-height: 40px !important;
            height: 40px !important;
            padding: 0 !important;
            justify-content: center !important;
            background: rgba(255, 255, 255, 0.06) !important;
            border: 0 !important;
            border-radius: 10px !important;
            color: #fff !important;
            display: flex !important;
            align-items: center !important;
        }

        .emulator-shell.show-native-menu #game .ejs_volume_parent {
            display: none !important;
        }

        .emulator-shell.show-native-menu #game .custom-menu-volume input[type=range] {
            width: 100% !important;
            min-width: 0 !important;
            margin: 0 !important;
            position: relative !important;
            z-index: 3 !important;
            display: block !important;
            accent-color: #8f21d7 !important;
            touch-action: manipulation !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_text {
            color: #fff !important;
            display: block !important;
            flex: 0 1 auto !important;
            opacity: 1 !important;
            transform: none !important;
            position: static !important;
            white-space: normal !important;
            background: transparent !important;
            box-shadow: none !important;
            margin: 0 !important;
            padding: 0 !important;
            pointer-events: none !important;
            text-align: center !important;
        }

        .emulator-shell.show-native-menu #game .ejs_menu_text::before,
        .emulator-shell.show-native-menu #game .ejs_menu_bar_spacer {
            display: none !important;
        }

        .controls {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-rows: auto auto auto;
            align-content: space-between;
            gap: clamp(18px, 3.2svh, 34px);
            margin: 0 calc(clamp(12px, 3vw, 18px) * -1) calc(max(16px, env(safe-area-inset-bottom)) * -1);
            padding: 0 clamp(12px, 3vw, 18px) max(10px, env(safe-area-inset-bottom));
            background: #d9d9d9;
            border-top: 2px solid rgba(255, 255, 255, 0.62);
            color: #111;
            position: relative;
        }

        .shoulder-row,
        .system-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controller-top {
            position: relative;
            display: grid;
            place-items: center;
            min-height: clamp(38px, 6svh, 54px);
            margin: 0 calc(clamp(12px, 3vw, 18px) * -1);
            background: #d9d9d9;
            border-bottom: 0;
        }

        .shoulder {
            position: absolute;
            top: clamp(7px, 1.3svh, 10px);
            width: clamp(120px, 31vw, 170px);
            height: clamp(34px, 5svh, 44px);
            border: 3px solid #070707;
            background: linear-gradient(180deg, #454545 0%, #383838 58%, #2b2b2b 100%);
            color: rgba(0, 0, 0, 0.76);
            font-size: clamp(21px, 5.4vw, 30px);
            font-weight: 800;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.07),
                inset 0 -10px 14px rgba(0, 0, 0, 0.42),
                0 3px 0 rgba(0, 0, 0, 0.62);
        }

        .shoulder.left {
            left: 0;
            border-radius: 0 0 22px 0;
        }

        .shoulder.right {
            right: 0;
            border-radius: 0 0 0 22px;
        }

        .ios-controller-logo {
            display: none;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        @media (orientation: portrait) {
            .ios-controller-logo {
                display: block;
                position: absolute;
                left: 50%;
                top: calc(clamp(7px, 1.3svh, 10px) + (clamp(34px, 5svh, 44px) / 2));
                width: clamp(108px, 29vw, 132px);
                height: clamp(42px, 7.2svh, 54px);
                object-fit: contain;
                transform: translate(-50%, -50%);
            }
        }

        .main-controls {
            display: grid;
            grid-template-columns: auto auto;
            align-items: center;
            justify-content: center;
            gap: clamp(28px, 7vw, 54px);
            padding-top: clamp(6px, 1.2svh, 14px);
        }

        .dpad-wrap {
            width: clamp(154px, min(40vw, 22svh), 184px);
            aspect-ratio: 1;
            position: relative;
            transform: translateY(12px);
        }

        .dpad-wrap::before {
            display: none;
        }

        .dpad {
            width: 100%;
            height: 100%;
            position: relative;
            filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.34));
        }

        .dpad-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            transition: filter 120ms ease, transform 120ms ease;
            z-index: 1;
        }

        .dpad-hit {
            position: absolute;
            border: 0;
            background: transparent;
            z-index: 2;
        }

        .dpad-hit.up,
        .dpad-hit.down {
            width: 38%;
            height: 38%;
            left: 31%;
        }

        .dpad-hit.left,
        .dpad-hit.right {
            width: 38%;
            height: 38%;
            top: 31%;
        }

        .dpad-hit.up { top: 7%; }
        .dpad-hit.down { bottom: 7%; }
        .dpad-hit.left { left: 7%; }
        .dpad-hit.right { right: 7%; }

        .face-buttons {
            --face-size: clamp(58px, min(14.8vw, 8.6svh), 70px);
            width: clamp(168px, min(43vw, 23.5svh), 196px);
            aspect-ratio: 1;
            justify-self: center;
            position: relative;
            border-radius: 50%;
            transform: none;
            background: #969696;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
        }

        .face-action {
            position: absolute;
            width: var(--face-size);
            aspect-ratio: 1;
            border: 4px solid #151515;
            border-radius: 50%;
            color: rgba(0, 0, 0, 0.28);
            font-size: clamp(23px, 6vw, 34px);
            font-weight: 800;
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.7),
                0 4px 0 rgba(0, 0, 0, 0.44),
                inset 0 5px 8px rgba(255, 255, 255, 0.34),
                inset 0 -12px 16px rgba(0, 0, 0, 0.22);
        }

        .face-action::before {
            display: none;
        }

        .face-action span {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            line-height: 1;
            pointer-events: none;
        }

        .face-action.a {
            right: 5%;
            top: calc(50% - (var(--face-size) / 2));
            background: radial-gradient(circle at 40% 34%, #ff6262 0%, #f51e2b 55%, #b80012 100%);
        }

        .face-action.b {
            left: calc(50% - (var(--face-size) / 2));
            bottom: 5%;
            background: radial-gradient(circle at 40% 34%, #ffe263 0%, #ffd019 58%, #c99f00 100%);
        }

        .face-action.x {
            left: calc(50% - (var(--face-size) / 2));
            top: 5%;
            background: radial-gradient(circle at 40% 34%, #3d91ff 0%, #1268d7 55%, #0742a2 100%);
        }

        .face-action.y {
            left: 5%;
            top: calc(50% - (var(--face-size) / 2));
            background: radial-gradient(circle at 40% 34%, #3bd66a 0%, #08aa45 55%, #007733 100%);
        }

        .system-row {
            width: min(286px, 72vw);
            margin: 0 auto;
            padding-top: clamp(2px, 1svh, 8px);
        }

        .system-control {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            color: #111;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .pill-button {
            width: auto;
            min-width: 0;
            height: auto;
            min-height: 0;
            padding: 7px 10px;
            border-radius: 999px;
            border: 2px solid #151515;
            background: linear-gradient(180deg, #d5d5d5, #a9a9a9);
            color: #151515;
            font-size: 11px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.78),
                0 2px 0 rgba(0, 0, 0, 0.24);
        }

        .pill-button::before {
            content: attr(aria-label);
        }

        .menu-button {
            width: auto;
            min-width: 0;
            height: auto;
            min-height: 0;
            padding: 7px 10px;
            border-radius: 999px;
            border: 2px solid #151515;
            background: linear-gradient(180deg, #d5d5d5, #a9a9a9);
            color: #151515;
            font-size: 0;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.78),
                0 2px 0 rgba(0, 0, 0, 0.24);
        }

        .menu-button::before {
            content: "Menu";
            font-size: 11px;
        }

        .menu-control {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            color: #111;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .system-control span,
        .menu-control span {
            display: none;
        }

        .touch-button {
            cursor: pointer;
            touch-action: none;
            outline: none;
        }

        .touch-button.is-pressed {
            filter: brightness(1.25);
            transform: scale(0.96);
        }

        .face-action.a.is-pressed,
        .face-action.b.is-pressed,
        .face-action.x.is-pressed,
        .face-action.y.is-pressed,
        .dpad-hit.is-pressed {
            transform: scale(0.96);
        }

        .dpad-wrap.pressed-up .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateY(-5px) scale(0.985);
        }

        .dpad-wrap.pressed-down .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateY(5px) scale(0.985);
        }

        .dpad-wrap.pressed-left .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateX(-5px) scale(0.985);
        }

        .dpad-wrap.pressed-right .dpad-image {
            filter: brightness(1.16) contrast(1.05);
            transform: translateX(5px) scale(0.985);
        }

        @media (max-height: 720px) {
            .emulator-shell {
                gap: 14px;
            }

            .controls {
                gap: 18px;
            }

            .screen-frame {
                padding-bottom: 20px;
            }

            .system-row {
                padding-top: 2px;
            }
        }

        @media (max-width: 520px) {
            .main-controls {
                gap: 18px;
            }

            .face-buttons {
                --face-size: 58px;
                width: 176px;
                transform: none;
            }

            .face-action {
                border-width: 4px;
            }

            .dpad-wrap {
                width: 163px;
            }
        }

        @media (max-width: 360px) {
            .main-controls {
                grid-template-columns: auto auto;
                gap: 14px;
            }

            .controls {
                padding-inline: 0;
            }

            .face-buttons {
                width: 132px;
            }

            .dpad-wrap {
                width: 145px;
            }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            body {
                display: block;
            }

            .emulator-shell {
                width: 100vw;
                height: 100svh;
                max-width: none;
                aspect-ratio: auto;
                margin: 0;
                padding:
                    max(14px, env(safe-area-inset-top))
                    max(10px, env(safe-area-inset-right))
                    max(14px, env(safe-area-inset-bottom))
                    max(10px, env(safe-area-inset-left));
                border: 0;
                border-radius: 0;
                display: grid;
                place-items: center;
                gap: 0;
                overflow: hidden;
            }

            .screen-frame {
                width: min(60vw, calc((100svh - 28px) * 4 / 3));
                max-width: calc(100vw - clamp(390px, 58vw, 460px));
                min-width: min(276px, calc(100vw - 360px));
                padding: clamp(6px, 1.8svh, 10px) clamp(6px, 1.8svh, 10px) clamp(10px, 2.4svh, 14px);
                border-radius: 10px;
                z-index: 1;
            }

            .controls {
                position: absolute;
                inset: 0;
                margin: 0;
                padding: 0;
                border: 0;
                background: transparent;
                display: block;
                pointer-events: none;
            }

            .controller-top {
                position: absolute;
                left: max(10px, env(safe-area-inset-left));
                right: max(10px, env(safe-area-inset-right));
                top: max(6px, env(safe-area-inset-top));
                min-height: 0;
                height: clamp(36px, 10svh, 46px);
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: transparent;
                z-index: 3;
            }

            .shoulder {
                position: static;
                width: clamp(118px, 19vw, 162px);
                height: clamp(36px, 10svh, 46px);
                border-width: 2px;
                border-radius: 14px;
                font-size: clamp(18px, 4.8svh, 24px);
                pointer-events: auto;
            }

            .shoulder.left,
            .shoulder.right {
                border-radius: 14px;
            }

            .main-controls {
                position: absolute;
                inset: 0;
                display: grid;
                grid-template-columns: clamp(174px, 27vw, 212px) minmax(276px, 1fr) clamp(198px, 29vw, 224px);
                align-items: center;
                justify-content: stretch;
                gap: 0;
                padding:
                    max(46px, calc(env(safe-area-inset-top) + 40px))
                    max(10px, env(safe-area-inset-right))
                    max(78px, calc(env(safe-area-inset-bottom) + 70px))
                    max(10px, env(safe-area-inset-left));
                z-index: 2;
            }

            .dpad-wrap {
                grid-column: 1;
                width: clamp(160px, min(26vw, 46svh), 196px);
                justify-self: center;
                margin-right: 0;
                pointer-events: auto;
                transform: translateY(clamp(18px, 2.8vw, 24px));
            }

            .face-buttons {
                grid-column: 3;
                --face-size: clamp(44px, min(6.2vw, 11.4svh), 50px);
                --face-inset: 10px;
                width: clamp(166px, min(22.5vw, 42svh), 190px);
                justify-self: end;
                pointer-events: auto;
                transform: translateY(24px);
            }

            .face-action {
                border-width: 3px;
                font-size: clamp(22px, 5.8svh, 30px);
                pointer-events: auto;
            }

            .face-action.a {
                right: var(--face-inset);
                top: calc(50% - (var(--face-size) / 2));
            }

            .face-action.b {
                left: calc(50% - (var(--face-size) / 2));

                }

                return normalizeMenuText([
                    button.dataset.customOriginalText,
                    button.getAttribute('aria-label'),
                    button.getAttribute('title'),
                    button.getAttribute('data-btn'),
                    button.className
                ].join(' '));
            }

            function getAllowedMenuAction(button) {
                var text = getMenuButtonText(button);

                if (text.indexOf('reset') !== -1 || text.indexOf('reiniciar') !== -1) {
                    return 'reset';
                }

                if (text.indexOf('pause') !== -1 || text.indexOf('pausar') !== -1 || text.indexOf('play') !== -1 || text.indexOf('resume') !== -1) {
                    return 'pause';
                }

                if ((text.indexOf('load') !== -1 && text.indexOf('state') !== -1) || text.indexOf('loadstate') !== -1 || text.indexOf('carregar') !== -1) {
                    return 'load-state';
                }

                if ((text.indexOf('save') !== -1 && text.indexOf('state') !== -1) || text.indexOf('savestate') !== -1 || text.indexOf('salvar') !== -1 || text.indexOf('armazenar') !== -1) {
                    return 'save-state';
                }

                return '';
            }

            function getAllowedMenuLabel(action) {
                if (action === 'reset') return 'Reset';
                if (action === 'pause') return 'Pausar';
                if (action === 'load-state') return 'Carregar Save State';
                if (action === 'save-state') return 'Armazenar Save State';

                return '';
            }

            function setMenuButtonLabel(button, label) {
                var text = button.querySelector('.ejs_menu_text');

                if (text && text.textContent !== label) {
                    text.textContent = label;
                } else if (!text && button.textContent !== label) {
                    button.textContent = label;
                }

                if (button.getAttribute('aria-label') !== label) {
                    button.setAttribute('aria-label', label);
                }
            }

            function bindPauseButton(button) {
                if (button.dataset.customPauseBound === 'true') return;

                button.dataset.customPauseBound = 'true';
                button.addEventListener('click', function() {
                    var menu = document.querySelector('#game .ejs_menu_bar');
                    var shell = document.querySelector('.emulator-shell');

                    if (!shell || (menu && menu.dataset.customResumingGame === 'true')) return;

                    window.setTimeout(function() {
                        shell.dataset.gamePaused = 'true';
                    }, 0);
                });
            }

            function customizeMenuOptions() {
                var menu = document.querySelector('#game .ejs_menu_bar');
                if (!menu) return;
                if (menu.dataset.customMenuBusy === 'true') return;

                menu.dataset.customMenuBusy = 'true';

                try {
                    menu.querySelectorAll('.custom-menu-volume, .ejs_volume_parent, .ejs_menu_bar_spacer').forEach(function(item) {
                        item.classList.add('custom-menu-hidden');
                    });

                    var usedActions = {};

                    menu.querySelectorAll('.ejs_menu_button').forEach(function(button) {
                        var action = getAllowedMenuAction(button);
                        var label = getAllowedMenuLabel(action);
                        var shouldShow = Boolean(action && label && !usedActions[action]);

                        button.classList.toggle('custom-menu-hidden', !shouldShow);

                        if (shouldShow) {
                            usedActions[action] = true;
                            setMenuButtonLabel(button, label);
                            button.dataset.customMenuAction = action;

                            if (action === 'pause') {
                                bindPauseButton(button);
                            }
                        } else {
                            delete button.dataset.customMenuAction;
                        }
                    });
                } finally {
                    menu.dataset.customMenuBusy = 'false';
                }
            }

            function watchMenuOptions() {
                var menu = document.querySelector('#game .ejs_menu_bar');
                if (!menu || menu.dataset.customMenuObserved) return;

                var observer = new MutationObserver(function() {
                    if (document.querySelector('.emulator-shell.show-native-menu')) {
                        customizeMenuOptions();
                    }
                });

                observer.observe(menu, {
                    childList: true,
                    subtree: true
                });
                menu.dataset.customMenuObserved = 'true';
            }

            function ensureVolumeControl() {
                var menu = document.querySelector('#game .ejs_menu_bar');
                if (!menu || menu.querySelector('.custom-menu-volume')) return;

                var volume = document.createElement('div');
                volume.className = 'custom-menu-volume';

                var icon = document.createElement('button');
                icon.type = 'button';
                icon.className = 'custom-volume-icon';
                icon.setAttribute('aria-label', 'Ativar ou desativar volume');
                icon.innerHTML = '<svg viewBox="0 0 640 512" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M533.6 32.5C598.5 85.2 640 165.8 640 256s-41.5 170.8-106.4 223.5c-10.3 8.4-25.4 6.8-33.8-3.5s-6.8-25.4 3.5-33.8C557.5 398.2 592 331.2 592 256S557.5 113.8 503.3 69.8C493 61.4 491.5 46.3 499.8 36s23.5-11.8 33.8-3.5zM473.1 107c43.2 35.2 70.9 88.9 70.9 149s-27.7 113.8-70.9 149c-10.3 8.4-25.4 6.8-33.8-3.5s-6.8-25.4 3.5-33.8C475.3 341.3 496 301.1 496 256s-20.7-85.3-53.2-111.8c-10.3-8.4-11.8-23.5-3.5-33.8s23.5-11.8 33.8-3.5zm-60.5 74.5C434.1 199.1 448 225.9 448 256s-13.9 56.9-35.4 74.5c-10.3 8.4-25.4 6.8-33.8-3.5s-6.8-25.4 3.5-33.8C393.1 284.4 400 271 400 256s-6.9-28.4-17.7-37.3c-10.3-8.4-11.8-23.5-3.5-33.8s23.5-11.8 33.8-3.5zM301.1 34.8C312.6 40 320 51.4 320 64v384c0 12.6-7.4 24-18.9 29.2s-25 3.1-34.4-5.3L131.8 352H48c-26.5 0-48-21.5-48-48v-96c0-26.5 21.5-48 48-48h83.8L266.7 40.1c9.4-8.4 22.9-10.4 34.4-5.3z"/></svg>';

                var slider = document.createElement('input');
                slider.type = 'range';
                slider.min = '0';
                slider.max = '1';
                slider.step = '0.01';
                slider.value = '0.5';
                slider.setAttribute('aria-label', 'Volume');

                volume.appendChild(icon);
                volume.appendChild(slider);
                volume.addEventListener('pointerdown', function(event) {
                    event.stopPropagation();
                });
                volume.addEventListener('pointermove', function(event) {
                    event.stopPropagation();
                });
                volume.addEventListener('pointerup', function(event) {
                    event.stopPropagation();
                });
                icon.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    var current = Number(slider.value);
                    var next = current > 0 ? 0 : (window.EJS_emulator && window.EJS_emulator.volume) || 0.5;
                    slider.value = next;
                    slider.style.setProperty('--value', (next * 100) + '%');
                    applyVolume(next);
                });
                menu.insertBefore(volume, menu.children[1] || null);
            }

            function applyVolume(value) {
                var volume = Math.max(0, Math.min(1, Number(value)));
                var emulator = window.EJS_emulator;

                if (!emulator) return;

                emulator.volume = volume;
                emulator.muted = volume === 0;

                if (emulator.setVolume) {
                    emulator.setVolume(volume);
                }

                if (emulator.Module && emulator.Module.SDL2 && emulator.Module.SDL2.audioContext && emulator.Module.SDL2.audioContext.state === 'suspended') {
                    emulator.Module.SDL2.audioContext.resume();
                }

                if (emulator.Module && emulator.Module.AL && emulator.Module.AL.currentCtx && emulator.Module.AL.currentCtx.audioCtx && emulator.Module.AL.currentCtx.audioCtx.state === 'suspended') {
                    emulator.Module.AL.currentCtx.audioCtx.resume();
                }

                if (emulator.Module && emulator.Module.AL && emulator.Module.AL.currentCtx && emulator.Module.AL.currentCtx.sources) {
                    emulator.Module.AL.currentCtx.sources.forEach(function(source) {
                        if (source && source.gain && source.gain.gain) {
                            source.gain.gain.value = volume;
                        }
                    });
                }

                try {
                    localStorage.setItem('ejs-settings', JSON.stringify({
                        volume: volume,
                        muted: volume === 0
                    }));
                } catch (error) {}
            }

            function setVolumeFromPointer(event, slider) {
                var rect = slider.getBoundingClientRect();
                var position = (event.clientX - rect.left) / rect.width;
                var value = Math.max(0, Math.min(1, position));

                slider.value = value;
                slider.style.setProperty('--value', (value * 100) + '%');
                applyVolume(value);
            }

            function syncVolumeSlider() {
                var slider = document.querySelector('#game .custom-menu-volume input[type="range"]');
                var nativeSlider = document.querySelector('#game .ejs_volume_parent input[type="range"]');
                var emulator = window.EJS_emulator;

                if (!slider || !emulator) return;

                if (!slider.dataset.customVolumeBound) {
                    var onVolumeInput = function() {
                        applyVolume(slider.value);
                    };

                    slider.addEventListener('input', onVolumeInput);
                    slider.addEventListener('change', onVolumeInput);
                    slider.addEventListener('mousedown', onVolumeInput);
                    slider.addEventListener('touchstart', onVolumeInput);
                    slider.addEventListener('touchmove', onVolumeInput);
                    slider.addEventListener('click', onVolumeInput);
                    slider.addEventListener('pointerdown', function(event) {
                        event.preventDefault();
                        event.stopPropagation();
                        slider.setPointerCapture(event.pointerId);
                        setVolumeFromPointer(event, slider);
                    });
                    slider.addEventListener('pointermove', function(event) {
                        if (event.buttons === 1 || event.pointerType === 'touch') {
                            event.preventDefault();
                            event.stopPropagation();
                            setVolumeFromPointer(event, slider);
                        }
                    });
                    slider.addEventListener('pointerup', function(event) {
                        event.preventDefault();
                        event.stopPropagation();
                        setVolumeFromPointer(event, slider);
                    });
                    slider.dataset.customVolumeBound = 'true';
                }

                slider.value = emulator.muted ? 0 : emulator.volume;
                slider.style.setProperty('--value', (Number(slider.value) * 100) + '%');

                if (nativeSlider) {
                    nativeSlider.value = slider.value;
                    nativeSlider.style.setProperty('--value', (Number(slider.value) * 100) + '%');
                }
            }

            var pendingMenuRetry = null;

            function toggleMenu(attempt) {
                var shell = document.querySelector('.emulator-shell');
                var menu = document.querySelector('#game .ejs_menu_bar');
                if (!shell) return;

                if (!menu) {
                    if ((attempt || 0) < 12) {
                        window.clearTimeout(pendingMenuRetry);
                        pendingMenuRetry = window.setTimeout(function() {
                            toggleMenu((attempt || 0) + 1);
                        }, 100);
                    }

                    return;
                }

                window.clearTimeout(pendingMenuRetry);
                pendingMenuRetry = null;

                var shouldOpen = !shell.classList.contains('show-native-menu');

                if (shouldOpen) {
                    ensureBackButton();
                    ensureInstagramButton();
                    watchMenuOptions();
                }

                shell.classList.toggle('show-native-menu', shouldOpen);

                menu.style.setProperty('display', shouldOpen ? 'flex' : 'none', 'important');
                menu.style.setProperty('opacity', shouldOpen ? '1' : '0', 'important');
                menu.style.setProperty('pointer-events', shouldOpen ? 'auto' : 'none', 'important');

                if (shouldOpen) {
                    customizeMenuOptions();
                    window.setTimeout(customizeMenuOptions, 120);
                }
            }

            var lastMenuActivation = 0;
            var lastMenuBackdropClose = 0;

            function activateMenu(event) {
                if (event) {
                    event.preventDefault();
                }

                var now = Date.now();
                if (now - lastMenuActivation < 350) return;
                lastMenuActivation = now;

                toggleMenu();
            }

            function handleMenuBackdropInteraction(event) {
                var shell = document.querySelector('.emulator-shell.show-native-menu');
                if (!shell) return;

                var target = event.target;
                if (target && target.closest && (target.closest('#game .ejs_menu_bar') || target.closest('[data-menu]'))) {
                    return;
                }

                if (event.cancelable) {
                    event.preventDefault();
                }

                event.stopPropagation();
                lastMenuBackdropClose = Date.now();
                returnToGameFromMenu();
            }

            function suppressMenuBackdropClick(event) {
                if (Date.now() - lastMenuBackdropClose > 350) {
                    handleMenuBackdropInteraction(event);
                    return;
                }

                if (event.cancelable) {
                    event.preventDefault();
                }

                event.stopPropagation();
            }

            document.addEventListener('selectstart', function(event) {
                if (event.target && event.target.closest && event.target.closest('.emulator-shell')) {
                    event.preventDefault();
                }
            });

            document.addEventListener('dragstart', function(event) {
                if (event.target && event.target.closest && event.target.closest('.emulator-shell')) {
                    event.preventDefault();
                }
            });

            document.querySelectorAll('[data-input]').forEach(function(button) {
                button.addEventListener('pointerdown', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    event.preventDefault();
                    press(button, event);
                });

                button.addEventListener('pointermove', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    event.preventDefault();
                    movePointer(event);
                });

                button.addEventListener('pointerup', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    event.preventDefault();
                    release(button, event);
                });

                button.addEventListener('pointercancel', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    event.preventDefault();
                    release(button, event);
                });

                button.addEventListener('lostpointercapture', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    if (!activePointers[event.pointerId]) {
                        release(button, event);
                    }
                });
            });

            document.querySelectorAll('.face-buttons').forEach(function(group) {
                group.addEventListener('pointerdown', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    if (event.target && event.target.closest && event.target.closest('[data-input]')) return;
                    event.preventDefault();
                    press(null, event);
                });

                group.addEventListener('pointerup', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    event.preventDefault();
                    release(null, event);
                });

                group.addEventListener('pointercancel', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    event.preventDefault();
                    release(null, event);
                });

                group.addEventListener('lostpointercapture', function(event) {
                    if (!shouldHandlePointerEvent(event)) return;
                    if (!activePointers[event.pointerId]) {
                        release(null, event);
                    }
                });
            });

            document.querySelector('.controls').addEventListener('pointermove', function(event) {
                if (!shouldHandlePointerEvent(event)) return;
                if (!activePointers[event.pointerId]) return;
                event.preventDefault();
                movePointer(event);
            });

            document.querySelector('.controls').addEventListener('touchstart', function(event) {
                if (usingPointerTouch) return;
                event.preventDefault();
                Array.prototype.forEach.call(event.changedTouches, pressTouch);
            }, { passive: false });

            document.querySelector('.controls').addEventListener('touchmove', function(event) {
                event.preventDefault();

                if (usingPointerTouch) {
                    syncPointerTouches(event);
                    return;
                }

                Array.prototype.forEach.call(event.changedTouches, moveTouch);
            }, { passive: false });

            document.querySelector('.controls').addEventListener('touchend', function(event) {
                event.preventDefault();

                if (usingPointerTouch) {
                    syncPointerTouches(event);
                    return;
                }

                releaseChangedTouches(event);
            }, { passive: false });

            document.querySelector('.controls').addEventListener('touchcancel', function(event) {
                event.preventDefault();

                if (usingPointerTouch) {
                    syncPointerTouches(event);
                    return;
                }

                releaseChangedTouches(event);
            }, { passive: false });

            var menuButton = document.querySelector('[data-menu]');
            menuButton.addEventListener('pointerup', activateMenu);
            menuButton.addEventListener('touchend', activateMenu, { passive: false });
            menuButton.addEventListener('click', activateMenu);

            document.addEventListener('pointerdown', handleMenuBackdropInteraction, true);
            document.addEventListener('touchstart', handleMenuBackdropInteraction, { capture: true, passive: false });
            document.addEventListener('click', suppressMenuBackdropClick, true);

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    closeMenu();
                }
            });

            window.addEventListener('pointerup', function(event) {
                if (!shouldHandlePointerEvent(event)) return;
                release(activePointers[event.pointerId], event);
            });

            window.addEventListener('blur', function() {
                activePointers = {};
                activeTouches = {};
                syncPressedButtons();
            });

            document.addEventListener('contextmenu', function(event) {
                event.preventDefault();
            });
        })();
    </script>
</body>
</html>
